services:
  postgres:
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dev/postgres/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command: migrate sql up -e --yes
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable
      - SECRETS_CIPHER_0=abcdefghijklmnopqrstuvwxyzABCDEF
      - SECRETS_COOKIE_0=abcdefghijklmnopqrstuvwxyzABCDEF
      - SECRETS_DFEAULT_0=abcdefghijklmnopqrstuvwxyzABCDEF
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command: serve all --dev --watch-courier -c /etc/kratos/kratos.yml
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable
      - SECRETS_CIPHER_0=abcdefghijklmnopqrstuvwxyzABCDEF
      - SECRETS_COOKIE_0=abcdefghijklmnopqrstuvwxyzABCDEF
      - SECRETS_DFEAULT_0=abcdefghijklmnopqrstuvwxyzABCDEF
    volumes:
      - ./dev/kratos.yml:/etc/kratos/kratos.yml:ro
    ports:
      - "14433:4433"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  oathkeeper:
    image: oryd/oathkeeper:v26.2.0@sha256:467329abde34feefca217b7af76fff59e77fe1795a19376e9d479f33c7c198fc
    command: serve proxy -c /etc/oathkeeper/oathkeeper.yml
    volumes:
      - ./dev/oathkeeper.yml:/etc/oathkeeper/oathkeeper.yml:ro
      - ./dev/access-rules.yml:/etc/oathkeeper/access-rules.yml:ro
    ports:
      - "14455:4455"
      - "24455:4455"
      - "34455:4455"
    extra_hosts:
      - host.docker.internal:host-gateway

  mailslurper:
    image: oryd/mailslurper:latest-smtps@sha256:d4b6583cc0f2715ca698c8ee2771b7d2e17d3c50f04070a1a1af63ba5867c615
    ports:
      - "4436:4436"
      - "4437:4437"

volumes:
  pgdata:
